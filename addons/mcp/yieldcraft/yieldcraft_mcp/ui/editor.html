<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ottomat editor</title><style>
:root{color-scheme:light dark;--bg:#f7f9fc;--ink:#1e293b;--muted:#64748b;--line:#cbd5e1;--kw:#7336a6;--type:#165c9d;--effect:#2d7540;--num:#a55016;--bad:#b91c1c} @media(prefers-color-scheme:dark){:root{--bg:#1b2330;--ink:#e2e8f0;--muted:#98a6b7;--line:#475569;--kw:#d5a3ef;--type:#91bfff;--effect:#a7dba4;--num:#f6a77a;--bad:#ff9292}} *{box-sizing:border-box} body{font:14px system-ui;margin:0;padding:14px;color:var(--ink)} header{display:flex;justify-content:space-between;align-items:center;gap:10px} h1{font-size:18px;margin:0} p{color:var(--muted);margin:8px 0 12px} textarea,pre{width:100%;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;tab-size:2} textarea{min-height:180px;resize:vertical} pre{overflow:auto;white-space:pre;margin:8px 0;max-height:400px} .kw{color:var(--kw);font-weight:650}.type{color:var(--type)}.effect{color:var(--effect)}.num{color:var(--num)}.bad{color:var(--bad)}.ln{color:var(--muted);display:inline-block;width:3ch;text-align:right;margin-right:1.5ch;user-select:none} button{padding:7px 12px;border-radius:6px;border:1px solid var(--line);color:var(--ink);background:var(--bg);cursor:pointer} button:disabled{opacity:.5;cursor:default} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center} #status{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:12px} label{display:block;font-weight:600;margin-top:8px} </style></head><body><header><h1>Ottomat strategy editor</h1><span>FinPRED</span></header><p>Source preview and validation. Only native admission permits execution; highlighting is not validation.</p><label for="source">Strategy source</label><textarea id="source" spellcheck="false" maxlength="8192">ottomat 3
input first scalar.level@1
input second scalar.level@1
effect pure
import maximum@1
import minimum@1
import distance@1
let spread = distance@1 hi lo
let hi = maximum@1 first second
let lo = minimum@1 first second
emit spread
</textarea><div class="row"><button id="validate" disabled>Server preflight</button><button id="save">Save .ottomat</button><button id="copy">Copy source</button></div><pre id="preview" aria-label="Highlighted source"></pre><div id="status" role="status">Standalone preview; server preflight requires an MCP Apps host.</div><script>
'use strict';
const el=id=>document.getElementById(id), src=el('source'), preview=el('preview'), status=el('status');
const keywords=new Set('ottomat ottmat input source transform algorithm strategy gate output profile effect import let emit'.split(' '));
const types=new Set('pure read record required optional target_bps curve objective'.split(' '));
function render(){preview.replaceChildren();src.value.split('\n').forEach((line,i)=>{const no=document.createElement('span');no.className='ln';no.textContent=String(i+1);preview.append(no);for(const t of line.match(/\s+|[A-Za-z][A-Za-z0-9_.-]*(?:@[0-9]+)?|[0-9]+|=|./g)||[]){const node=document.createElement('span');node.className=keywords.has(t)?'kw':types.has(t)?'effect':t.includes('@')?'type':/^\d+$/.test(t)?'num':/^[A-Za-z\s=]/.test(t)?'':'bad';node.textContent=t;preview.append(node)}preview.append(document.createTextNode('\n'))});size()}
function setSource(v){if(typeof v==='string'&&v.length<=8192){src.value=v;render()}}
src.addEventListener('input',render);el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(src.value);status.textContent='Copied.'}catch{src.select();status.textContent='Source selected; use your normal copy shortcut.'}};
el('save').onclick=()=>{const url=URL.createObjectURL(new Blob([src.value],{type:'text/plain'}));const a=document.createElement('a');a.href=url;a.download='strategy.ottomat';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};
// Minimal MCP Apps JSON-RPC bridge. No network, credentials or arbitrary HTML.
// Host compatibility remains an explicit integration gate; standalone mode is usable.
const pending=new Map();let seq=0,connected=false,hostOrigin=null;
function notify(method,params){if(window.parent!==window)window.parent.postMessage({jsonrpc:'2.0',method,params},hostOrigin&&hostOrigin!=='null'?hostOrigin:'*')}
function request(method,params){return new Promise((resolve,reject)=>{const id=++seq;const timer=setTimeout(()=>{pending.delete(id);reject(new Error('Host response timeout'))},10000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},hostOrigin&&hostOrigin!=='null'?hostOrigin:'*')})}
function size(){if(connected)notify('ui/notifications/size-changed',{height:document.documentElement.scrollHeight})}
function resultSource(result){const r=result?.structuredContent||result?.structured_content;if(r?.source)setSource(r.source);else for(const c of result?.content||[]){if(c.type==='text'){try{const v=JSON.parse(c.text);if(v.source)setSource(v.source)}catch{}}}}
window.addEventListener('message',e=>{if(e.source!==window.parent||window.parent===window||!e.data||e.data.jsonrpc!=='2.0'||(hostOrigin!==null&&e.origin!==hostOrigin))return;const m=e.data;if(m.id!==undefined&&pending.has(m.id)&&('result'in m||'error'in m)){const p=pending.get(m.id);pending.delete(m.id);clearTimeout(p.timer);if(hostOrigin===null)hostOrigin=e.origin;m.error?p.reject(new Error(m.error.message||'Host rejected request')):p.resolve(m.result);return}if(!connected)return;if(m.method==='ui/notifications/tool-result')resultSource(m.params);if(m.method==='ui/notifications/tool-input')setSource(m.params?.arguments?.source);if(m.method==='ui/notifications/host-context-changed')size();if(m.id!==undefined&&m.method==='ping')window.parent.postMessage({jsonrpc:'2.0',id:m.id,result:{}},hostOrigin==='null'?'*':hostOrigin)});
el('validate').onclick=async()=>{el('validate').disabled=true;try{const r=await request('tools/call',{name:'ottomat_validate',arguments:{source:src.value}});const v=r.structuredContent||r.structured_content||JSON.parse(r.content[0].text);status.textContent=JSON.stringify(v,null,2)}catch(e){status.textContent=e.message}finally{el('validate').disabled=false;size()}};
render();if(window.parent!==window)request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'Yieldcraft Ottomat editor',version:'0.1.0'},appCapabilities:{}}).then(r=>{if(r.protocolVersion!=='2026-01-26')throw Error('Unsupported Apps protocol');connected=true;notify('ui/notifications/initialized',{});el('validate').disabled=!r.hostCapabilities?.serverTools;status.textContent='MCP Apps connected. Server preflight is not general native lowering.';size()}).catch(e=>status.textContent='Host bridge unavailable: '+e.message);
</script></body></html>
