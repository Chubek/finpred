name: Install schema validator
description: Provide the Draft 2020-12 test dependency in an isolated environment
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/validation"
        "$RUNNER_TEMP/validation/bin/python" -m pip install \
          --require-hashes --only-binary=:all: -r "$GITHUB_WORKSPACE/tests/requirements-schema.txt"
        echo "$RUNNER_TEMP/validation/bin" >> "$GITHUB_PATH"
