name: Verify FinPRED
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  compiler:
    name: Compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/pinned-toolchain
      - name: Verify pinned On1x and GrammarEmbed integration
        run: |
          cmake --build build/mulib/on1x --parallel 4 --target \
            on1x_grammarembed_reference on1x_grammarembed_bridge_tests on1x_ppx_LuaEmbed
          ctest --test-dir build/mulib/on1x --output-on-failure --no-tests=error \
            -R '^on1x\.(grammarembed(_bridge)?|stdlib_project)$'
      - run: make test-compiler
      - name: Verify deterministic CLI release and relocated replay
        run: python3 tests/check_cli_release.py

  pricing:
    name: Pricing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/pinned-toolchain
      - uses: ./.github/actions/schema-validator
      - name: Install tracing for offline cube replay
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace
          strace -f -e trace=network -o "$RUNNER_TEMP/strace-probe" /usr/bin/true
      - run: make
      - run: make test-pricing

  forecasting:
    name: Forecasting
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/pinned-toolchain
      - uses: ./.github/actions/schema-validator
      - name: Install fixture decoder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxml2-dev libjansson-dev
          pkg-config --modversion libxml-2.0 jansson
      - run: make
      - run: make test-forecasting

  plugins:
    name: Plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/pinned-toolchain
      - uses: ./.github/actions/schema-validator
      - name: Install and verify Dragnet and private X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libcurl4-openssl-dev libxml2-dev libjansson-dev \
            libx11-dev strace xvfb xauth xfonts-base
          pkg-config --atleast-version=7.85 libcurl
          pkg-config --modversion libcurl libxml-2.0 jansson x11
          strace -f -e trace=network -o "$RUNNER_TEMP/strace-probe" /usr/bin/true
          xvfb-run -a -s '-screen 0 1024x768x24' /usr/bin/true
      - run: make
      - run: make test-plugins

  storage:
    name: Storage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Select a filesystem supported by the native store
        run: bash .github/scripts/native-storage-path.sh
      - uses: ./.github/actions/pinned-toolchain
      - uses: ./.github/actions/schema-validator
      - run: make
      - run: make test-storage
      - name: Unmount the native storage fixture volume if mounted
        if: always()
        run: |
          path="$RUNNER_TEMP/finpred-native-fs"
          if mountpoint -q "$path"; then
            sudo umount "$path"
          fi

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/pinned-toolchain
      - uses: ./.github/actions/schema-validator
      - name: Install offline worker sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          /usr/bin/bwrap --version
      - name: Verify the static probe and real offline sandbox
        run: python3 tests/check_offline_worker.py --preflight
      - run: make
      - run: make test-security
